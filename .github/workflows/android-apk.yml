name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint
        env:
          EXPO_OFFLINE: 1

      - name: Money, ledger and database tests
        run: npx vitest run

      - name: Screen render tests
        run: npx jest --ci

      - name: Generate Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK (arm64-v8a + armeabi-v7a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/paisa-pause-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: paisa-pause-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Releases (private repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Paisa Pause ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Android APK (arm64-v8a + armeabi-v7a) built from ${GITHUB_SHA::7}. Open this page on your phone, tap the .apk, then allow installing from your browser if asked."
